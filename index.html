<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YOLOv11 - Frontend</title>
  <style>
    body{font-family:Arial, sans-serif;background:#111;color:#fff;text-align:center;padding:20px}
    #videoFeed{width:80%;max-width:800px;border-radius:8px;border:3px solid #00ffcc;margin:20px auto;display:block}
    #localVideo{width:80%;max-width:800px;border-radius:8px;border:3px solid #ff00ff;margin:20px auto;display:none}
    button{padding:10px 18px;margin:8px;border-radius:8px;border:none;background:#00ffcc;color:#000;cursor:pointer;font-size:16px}
    button:disabled{background:#666;cursor:not-allowed}
    .status{margin:10px;padding:10px;border-radius:8px;background:#222}
    canvas{display:none}
    .projects-section{margin-top:60px;padding:20px}
    .projects-section h2{color:#00ffcc;margin-bottom:20px;font-size:28px;text-shadow:0 0 10px rgba(0,255,204,0.5)}
    #bgVideo{width:80%;max-width:900px;border-radius:12px;border:3px solid #00ffcc;box-shadow:0 0 20px rgba(0,255,204,0.3);margin:20px auto;display:block}
  </style>
</head>
<body>
  <h1>Computer Vision Project</h1>
  <p class="status" id="status">Ready to start</p>
  <p>
    <button id="startBtn">Start Camera</button>
    <button id="stopBtn" disabled>Stop Camera</button>
  </p>

  <div>
    <video id="localVideo" autoplay playsinline></video>
    <img id="videoFeed" alt="Processed video will appear here" />
  </div>

  <div class="projects-section">
    <h2>More such computer vision projects</h2>
    <video id="bgVideo" autoplay loop muted playsinline>
      <source src="output2.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <p id="videoStatus" style="color:#ff6b6b;margin-top:10px"></p>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const BACKEND = "https://aging-diagram-professionals-viewers.trycloudflare.com";
    
    let localStream = null;
    let isProcessing = false;
    let videoElement, canvas, ctx, imgElement;

    window.addEventListener('DOMContentLoaded', () => {
      videoElement = document.getElementById('localVideo');
      canvas = document.getElementById('canvas');
      ctx = canvas.getContext('2d');
      imgElement = document.getElementById('videoFeed');
      
      document.getElementById("startBtn").addEventListener("click", startCamera);
      document.getElementById("stopBtn").addEventListener("click", stopCamera);
      
      // Debug background video
      const bgVideo = document.getElementById('bgVideo');
      const videoStatus = document.getElementById('videoStatus');
      
      bgVideo.addEventListener('loadstart', () => {
        console.log('Video loading started...');
        videoStatus.textContent = 'Loading video...';
      });
      
      bgVideo.addEventListener('loadeddata', () => {
        console.log('Video data loaded!');
        videoStatus.textContent = 'Video loaded successfully!';
        setTimeout(() => videoStatus.textContent = '', 2000);
      });
      
      bgVideo.addEventListener('error', (e) => {
        console.error('Video error:', bgVideo.error);
        let errorMsg = 'Video failed to load. ';
        if (bgVideo.error) {
          switch(bgVideo.error.code) {
            case 1: errorMsg += 'MEDIA_ERR_ABORTED - Video loading was aborted'; break;
            case 2: errorMsg += 'MEDIA_ERR_NETWORK - Network error while loading video'; break;
            case 3: errorMsg += 'MEDIA_ERR_DECODE - Video decoding error'; break;
            case 4: errorMsg += 'MEDIA_ERR_SRC_NOT_SUPPORTED - Video format not supported'; break;
            default: errorMsg += 'Unknown error';
          }
        }
        videoStatus.textContent = errorMsg;
        console.log('Video source:', bgVideo.currentSrc);
      });
      
      bgVideo.addEventListener('canplay', () => {
        console.log('Video can start playing!');
      });
    });

    async function startCamera() {
      try {
        updateStatus('Requesting camera access...');
        
        // Request access to the user's local camera
        localStream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: 'user' 
          } 
        });
        
        videoElement.srcObject = localStream;
        videoElement.style.display = 'block';
        imgElement.style.display = 'none';
        
        updateStatus('Camera started. Processing frames...');
        isProcessing = true;
        
        // Enable/disable buttons
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        
        // Start sending frames to backend
        sendFramesToBackend();
        
      } catch (err) {
        updateStatus('Error: ' + err.message);
        console.error('Camera access error:', err);
        alert('Failed to access camera. Please allow camera permissions.');
      }
    }

    async function sendFramesToBackend() {
      if (!isProcessing) return;
      
      // Capture frame from video element
      canvas.width = videoElement.videoWidth;
      canvas.height = videoElement.videoHeight;
      ctx.drawImage(videoElement, 0, 0);
      
      // Convert canvas to blob
      canvas.toBlob(async (blob) => {
        if (!isProcessing) return;
        
        try {
          const formData = new FormData();
          formData.append('frame', blob, 'frame.jpg');
          
          const response = await fetch(`${BACKEND}/process_frame`, {
            method: 'POST',
            body: formData
          });
          
          if (response.ok) {
            const result = await response.json();
            if (result.processed_frame) {
              // Display the processed frame
              imgElement.src = 'data:image/jpeg;base64,' + result.processed_frame;
              imgElement.style.display = 'block';
              videoElement.style.display = 'none';
            }
          }
        } catch (err) {
          console.error('Frame processing error:', err);
        }
        
        // Continue processing
        if (isProcessing) {
          setTimeout(() => sendFramesToBackend(), 100); // ~10 FPS
        }
      }, 'image/jpeg', 0.8);
    }

    function stopCamera() {
      isProcessing = false;
      
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      
      videoElement.srcObject = null;
      videoElement.style.display = 'none';
      imgElement.src = '';
      imgElement.style.display = 'none';
      
      updateStatus('Camera stopped');
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }

    function updateStatus(message) {
      document.getElementById('status').textContent = message;
    }
  </script>
</body>
</html>
